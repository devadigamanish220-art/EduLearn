<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - EduLearn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🎓 EduLearn
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-btn">Register</a>
    </nav>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <h1>🎓 EduLearn</h1>

            <h2>Start Learning Today</h2>

            <p>
                Create your EduLearn account and
                begin developing valuable skills
                through online courses.
            </p>

        </div>


        <div class="auth-box">

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Register as a student
            </p>


            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <button
                    type="submit"
                    class="btn full-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</main>


<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Registration connection will be added next.");

});

</script>

</body>

</html>
