<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduLearn</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        🎓 EduLearn
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-btn">Register</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-container">

        <div class="auth-left">
            <h1>🎓 EduLearn</h1>

            <h2>Welcome Back!</h2>

            <p>
                Continue your learning journey
                and develop new skills with EduLearn.
            </p>
        </div>

        <div class="auth-box">

            <h2>Login</h2>

            <p class="auth-subtitle">
                Login to your EduLearn account
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn full-btn">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

</main>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Login connection will be added next.");

});
</script>

</body>
</html>
